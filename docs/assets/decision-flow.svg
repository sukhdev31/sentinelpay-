<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">SentinelPay decision flow</title><desc id="desc">A transaction passes validation, evidence collection and policy fusion before approval, review or decline.</desc>
  <rect width="1400" height="520" rx="26" fill="#07111c"/>
  <text x="70" y="72" fill="#f4f8fb" font-family="Inter,Segoe UI,Arial" font-size="38" font-weight="800">From transaction to explainable action</text>
  <text x="70" y="108" fill="#91a8b6" font-family="Inter,Segoe UI,Arial" font-size="19">Risk is not a black box: component evidence and reason codes travel with every decision.</text>
  <g stroke="#526f80" stroke-width="3" fill="none"><path d="M276 260H346"/><path d="M610 260H680"/><path d="M944 260H1014"/></g>
  <g font-family="Inter,Segoe UI,Arial" text-anchor="middle">
    <g><rect x="70" y="185" width="206" height="150" rx="18" fill="#102333" stroke="#294457"/><circle cx="173" cy="228" r="22" fill="#173a43"/><text x="173" y="235" fill="#55dfd2" font-size="19" font-weight="800">1</text><text x="173" y="277" fill="#f0f6f8" font-size="19" font-weight="700">VALIDATE</text><text x="173" y="305" fill="#9fb2bd" font-size="15">Schema · Auth · Duplicate</text></g>
    <g><rect x="346" y="185" width="264" height="150" rx="18" fill="#102333" stroke="#294457"/><circle cx="478" cy="228" r="22" fill="#173a43"/><text x="478" y="235" fill="#55dfd2" font-size="19" font-weight="800">2</text><text x="478" y="277" fill="#f0f6f8" font-size="19" font-weight="700">COLLECT EVIDENCE</text><text x="478" y="305" fill="#9fb2bd" font-size="15">Rules · ML · Anomaly · Graph</text></g>
    <g><rect x="680" y="185" width="264" height="150" rx="18" fill="#14302f" stroke="#47cfc4"/><circle cx="812" cy="228" r="22" fill="#21504e"/><text x="812" y="235" fill="#72eee4" font-size="19" font-weight="800">3</text><text x="812" y="277" fill="#f0f6f8" font-size="19" font-weight="700">FUSE + EXPLAIN</text><text x="812" y="305" fill="#b8d7d3" font-size="15">Score · Policy · Reason codes</text></g>
    <g><rect x="1014" y="185" width="316" height="150" rx="18" fill="#102333" stroke="#294457"/><circle cx="1172" cy="228" r="22" fill="#173a43"/><text x="1172" y="235" fill="#55dfd2" font-size="19" font-weight="800">4</text><text x="1172" y="277" fill="#f0f6f8" font-size="19" font-weight="700">ACT + RECORD</text><text x="1074" y="309" fill="#75e0a5" font-size="13" font-weight="700">APPROVE</text><text x="1172" y="309" fill="#ffca67" font-size="13" font-weight="700">REVIEW</text><text x="1270" y="309" fill="#ff7d88" font-size="13" font-weight="700">DECLINE</text></g>
  </g>
  <rect x="70" y="392" width="1260" height="66" rx="14" fill="#0c1c29" stroke="#22394a"/>
  <text x="700" y="433" text-anchor="middle" fill="#b7c7d0" font-family="Inter,Segoe UI,Arial" font-size="18">Fallback behaviour routes uncertainty to human review when models, features or dependencies are unavailable.</text>
</svg>
