<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc"><title id="title">SentinelPay model evaluation snapshot</title><desc id="desc">The reproducible synthetic-data evaluation contains 6250 test rows, 5.44 percent fraud, 0.6803 ROC AUC and 0.1478 average precision.</desc><rect width="1400" height="430" rx="26" fill="#07111c"/><g font-family="Inter,Segoe UI,Arial"><text x="70" y="70" fill="#f4f8fb" font-size="38" font-weight="800">Reproducible model evaluation</text><text x="70" y="107" fill="#91a8b6" font-size="19">Baseline results from the committed synthetic-data experiment—not a production performance claim.</text><g transform="translate(70 155)"><g><rect width="285" height="165" rx="16" fill="#102333" stroke="#294457"/><text x="25" y="42" fill="#91a8b6" font-size="17">ROC-AUC</text><text x="25" y="105" fill="#55dfd2" font-size="50" font-weight="800">0.6803</text><text x="25" y="138" fill="#6f8998" font-size="14">Discrimination baseline</text></g><g transform="translate(315)"><rect width="285" height="165" rx="16" fill="#102333" stroke="#294457"/><text x="25" y="42" fill="#91a8b6" font-size="17">Average precision</text><text x="25" y="105" fill="#55dfd2" font-size="50" font-weight="800">0.1478</text><text x="25" y="138" fill="#6f8998" font-size="14">Imbalanced-class metric</text></g><g transform="translate(630)"><rect width="285" height="165" rx="16" fill="#102333" stroke="#294457"/><text x="25" y="42" fill="#91a8b6" font-size="17">Test rows</text><text x="25" y="105" fill="#f4f8fb" font-size="50" font-weight="800">6,250</text><text x="25" y="138" fill="#6f8998" font-size="14">Held-out synthetic set</text></g><g transform="translate(945)"><rect width="285" height="165" rx="16" fill="#102333" stroke="#294457"/><text x="25" y="42" fill="#91a8b6" font-size="17">Fraud prevalence</text><text x="25" y="105" fill="#ffca67" font-size="50" font-weight="800">5.44%</text><text x="25" y="138" fill="#6f8998" font-size="14">Synthetic test distribution</text></g></g><text x="70" y="375" fill="#7f96a4" font-size="16">The portfolio demonstrates system design, governance and explainability; further calibration and real-world validation are required.</text></g></svg>
