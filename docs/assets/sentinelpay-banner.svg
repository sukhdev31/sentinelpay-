    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#48e0d2"/><stop offset="1" stop-color="#1597a8"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#39d7c7" stop-opacity=".28"/><stop offset="1" stop-color="#39d7c7" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1400" height="460" rx="28" fill="url(#bg)"/>
  <circle cx="1170" cy="220" r="230" fill="url(#glow)"/>
