[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelpay"
version = "1.0.0"
description = "Real-time payment fraud intelligence and decisioning platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "redis>=5.2,<7.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "structlog>=24.4,<26.0",
    "uvicorn[standard]>=0.34,<1.0",
    "joblib>=1.4,<2.0",
    "numpy>=2.0,<3.0",
    "scikit-learn>=1.6,<2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
]

[project.scripts]
sentinelpay-generate = "sentinelpay.ml.synthetic:main"
sentinelpay-train = "sentinelpay.ml.train:main"
sentinelpay-evaluate = "sentinelpay.ml.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinelpay = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sentinelpay"]
mypy_path = "src"

[tool.coverage.run]
source = ["sentinelpay"]
branch = true

[tool.coverage.report]
fail_under = 80
